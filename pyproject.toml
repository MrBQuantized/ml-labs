[project]
name = "machine-learning"
version = "0.1.0"
description = "Machine learning learning and project repository"
readme = "README.md"
authors = [
    { name = "MrBQuantized", email = "onohblessing24@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "catboost>=1.2.10",
    "fastapi[standard]>=0.141.1",
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "kaleido>=1.3.0",
    "lightgbm>=4.7.0",
    "lime>=0.2.0.1",
    "matplotlib>=3.11.1",
    "notebook>=7.6.1",
    "numba>=0.60",
    "numpy>=2.3.5",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "polars>=1.44.2",
    "pydantic>=2.13.4",
    "qtconsole>=5.7.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "statsmodels>=0.14.6",
    "streamlit>=1.61.1",
    "xgboost>=3.4.0",
]

[tool.uv]
environments = [
    "sys_platform == 'win32'"
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
